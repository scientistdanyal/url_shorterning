# name shown in the GitHub Actions tab
name: CI

# when should this pipeline run?
on:
  push:
    branches: [main]   # every push to main
  pull_request:
    branches: [main]   # every PR targeting main

jobs:
  # one job = one virtual machine doing work
  backend:
    name: Backend checks
    runs-on: ubuntu-latest  # free GitHub-hosted Linux runner

    defaults:
      run:
        working-directory: backend  # all "run" commands start in backend/

    steps:
      # 1) download your repo code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 3) install packages from package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4) sanity check: Node can load the short-code helper
      - name: Smoke test shortCode helper
        run: node -e "import('./utils/shortCode.js').then(m => { const c = m.generateShortCode(); if (!c || c.length < 5) process.exit(1); console.log('ok', c); })"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # build React app — fails CI if code has build errors
      - name: Build
        run: npm run build